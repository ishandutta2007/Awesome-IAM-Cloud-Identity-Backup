<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1" fill="#38bdf8" fill-opacity="0.4" />
    </pattern>

    <!-- Filters -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badgeShadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <style>
    @keyframes floatOrb1 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(40px, -25px) scale(1.15); }
    }
    @keyframes floatOrb2 {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-35px, 20px) scale(1.1); }
    }
    @keyframes pulseLine {
      0%, 100% { stroke-dashoffset: 0; opacity: 0.3; }
      50% { stroke-dashoffset: 40; opacity: 0.8; }
    }
    @keyframes shieldPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px rgba(56, 189, 248, 0.4)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 20px rgba(129, 140, 248, 0.8)); }
    }
    @keyframes pillFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes pillFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(6px); }
    }

    .orb-1 { animation: floatOrb1 10s ease-in-out infinite; transform-origin: center; }
    .orb-2 { animation: floatOrb2 12s ease-in-out infinite; transform-origin: center; }
    .shield-icon { animation: shieldPulse 4s ease-in-out infinite; transform-origin: 1020px 210px; }
    .stream-line { stroke-dasharray: 8 6; animation: pulseLine 6s linear infinite; }
    .pill-1 { animation: pillFloat1 5s ease-in-out infinite; }
    .pill-2 { animation: pillFloat2 6s ease-in-out infinite 0.5s; }
    .pill-3 { animation: pillFloat1 5.5s ease-in-out infinite 1s; }
    .pill-4 { animation: pillFloat2 6.5s ease-in-out infinite 1.5s; }

    .title-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      letter-spacing: 0.2px;
    }
    .tag-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-weight: 600;
      font-size: 13px;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)" />

  <!-- Animated Glowing Background Orbs (Behind Content) -->
  <circle class="orb-1" cx="200" cy="120" r="180" fill="url(#glowGrad1)" />
  <circle class="orb-2" cx="1000" cy="280" r="220" fill="url(#glowGrad2)" />
  <circle class="orb-1" cx="620" cy="350" r="140" fill="url(#glowGrad1)" />

  <!-- Subtle Dynamic Circuit/Stream Lines -->
  <path class="stream-line" d="M 80 320 Q 350 370 600 330 T 1120 340" fill="none" stroke="#38bdf8" stroke-width="1.5" />
  <path class="stream-line" d="M 120 70 Q 450 30 750 90 T 1140 100" fill="none" stroke="#818cf8" stroke-width="1" />
  <path class="stream-line" d="M 850 60 L 980 180 L 1120 180" fill="none" stroke="#c084fc" stroke-width="1" />

  <!-- Shield / Identity Fortress Decorative Icon on the Right -->
  <g class="shield-icon">
    <!-- Shield Outer Glow -->
    <circle cx="1020" cy="210" r="95" fill="#1e293b" fill-opacity="0.5" stroke="#334155" stroke-width="1.5" />
    <path d="M 1020 135 L 1075 160 C 1075 220 1020 265 1020 265 C 1020 265 965 220 965 160 Z" 
          fill="url(#cardGrad)" stroke="url(#primaryGrad)" stroke-width="3" />
    <!-- Lock / Identity Key Symbol inside Shield -->
    <rect x="1005" y="195" width="30" height="24" rx="4" fill="#38bdf8" fill-opacity="0.9" />
    <path d="M 1012 195 L 1012 186 C 1012 181.5 1015.5 178 1020 178 C 1024.5 178 1028 181.5 1028 186 L 1028 195" 
          fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
    <circle cx="1020" cy="205" r="2.5" fill="#0f172a" />
    <path d="M 1020 207.5 L 1020 213" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    <!-- Floating Orbiting Particles around Shield -->
    <circle cx="950" cy="180" r="4" fill="#38bdf8" opacity="0.8" />
    <circle cx="1085" cy="235" r="3" fill="#c084fc" opacity="0.8" />
    <circle cx="1020" cy="285" r="4" fill="#818cf8" opacity="0.7" />
  </g>

  <!-- Foreground Content (Guaranteed crisp and in foreground) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill: Category Tag -->
    <g transform="translate(0, 52)" class="pill-1">
      <rect width="250" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" filter="url(#badgeShadow)" />
      <circle cx="16" cy="16" r="5" fill="#38bdf8" />
      <text x="30" y="21" fill="#38bdf8" class="tag-text">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="145" class="title-text" font-size="46" fill="#f8fafc">
      Awesome IAM &amp; Cloud Identity
    </text>
    <text x="0" y="195" class="title-text" font-size="42" fill="url(#primaryGrad)">
      Backup &amp; Resilience
    </text>

    <!-- Subtitle -->
    <text x="0" y="240" class="subtitle-text" font-size="18" fill="#94a3b8">
      Identity Threat Detection &amp; Response (ITDR) • Active Directory Disaster Recovery
    </text>
    <text x="0" y="268" class="subtitle-text" font-size="18" fill="#cbd5e1">
      Cloud Identity Governance • SaaS Solutions • Open-Source Defenses
    </text>

    <!-- Dynamic Interactive Feature Pills / Badges in Foreground -->
    <g transform="translate(0, 315)">
      <!-- Pill 1: ITDR -->
      <g class="pill-1" transform="translate(0, 0)">
        <rect width="180" height="42" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.2" filter="url(#badgeShadow)" />
        <text x="20" y="26" class="tag-text" fill="#e2e8f0">🛡️ ITDR &amp; Threat Sec</text>
      </g>

      <!-- Pill 2: AD Recovery -->
      <g class="pill-2" transform="translate(195, 0)">
        <rect width="195" height="42" rx="10" fill="url(#cardGrad)" stroke="#818cf8" stroke-opacity="0.5" stroke-width="1.2" filter="url(#badgeShadow)" />
        <text x="18" y="26" class="tag-text" fill="#e2e8f0">🔄 AD Forest Recovery</text>
      </g>

      <!-- Pill 3: Hybrid Entra & Cloud -->
      <g class="pill-3" transform="translate(405, 0)">
        <rect width="215" height="42" rx="10" fill="url(#cardGrad)" stroke="#c084fc" stroke-opacity="0.5" stroke-width="1.2" filter="url(#badgeShadow)" />
        <text x="18" y="26" class="tag-text" fill="#e2e8f0">☁️ Entra ID &amp; Cloud IAM</text>
      </g>

      <!-- Pill 4: Open Source -->
      <g class="pill-4" transform="translate(635, 0)">
        <rect width="175" height="42" rx="10" fill="url(#cardGrad)" stroke="#34d399" stroke-opacity="0.5" stroke-width="1.2" filter="url(#badgeShadow)" />
        <text x="18" y="26" class="tag-text" fill="#e2e8f0">⭐ Open Source First</text>
      </g>
    </g>
  </g>

  <!-- Border Highlight -->
  <rect width="1198" height="418" x="1" y="1" rx="16" fill="none" stroke="#475569" stroke-width="1" stroke-opacity="0.4" />
</svg>